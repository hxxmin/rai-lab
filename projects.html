---
layout: page
title: "Projects"
header-img: "img/home-bg.jpg"
---

<table>
    {% assign year_counts = site.data.project %}  
    {% for pub in group.items %}
    <tr>
        <td class="pub-details">
            <b class="pub-title">{{ pub.title }}</b> <br>
            <span class="pub-info">
                {{pub.period}}
                <br>
                {{pub.funder}}
            </span>
        </td>
    </tr>
    {% endfor %}
</table>

<style>
    .publications {
        width: 80%;
        margin: auto;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    .pub-year {
        width: 10%;
        font-weight: bold;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
        background-color: #f9f9f9;
        font-size: 14px;
    }
    .pub-details {
        width: 90%;
        padding-left: 15px;
        vertical-align: top;
        font-size: 14px; 
    }
    .pub-title {
        font-size: 16px; 
    }
    .pub-authors, .pub-paper, .pub-volume, .pub-number, .pub-pages {
        font-size: 14px; 
        color: #666;
    }
    .pub-link {
        font-size: 13px;
        color: blue;
        text-decoration: none;
    }
    tr {
        border-bottom: 1px solid #ddd;
    }
    tr:first-child {
        border-top: 1px solid #ddd;
    }
</style>
