name: Sync Publications from Google Sheet (split)

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests pyyaml

      - name: Sync data from Google Sheet tabs
        env:
          JOURNAL_CSV_URL: ${{ secrets.JOURNAL_CSV_URL }}
          CONF_CSV_URL: ${{ secrets.CONF_CSV_URL }}
          PATENT_CSV_URL: ${{ secrets.PATENT_CSV_URL }}
          PROJECT_CSV_URL: ${{ secrets.PROJECT_CSV_URL }}
          NEWS_CSV_URL: ${{ secrets.NEWS_CSV_URL }}
        run: |
          python scripts/sync_from_gsheets_tabs.py "$JOURNAL_CSV_URL" "$CONF_CSV_URL" "$PATENT_CSV_URL" "$PROJECT_CSV_URL" "$NEWS_CSV_URL"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/*.yml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync publications from Google Sheet"
          git push
